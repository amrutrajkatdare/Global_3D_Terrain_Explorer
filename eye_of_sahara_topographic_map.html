<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Global 3D Terrain Explorer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #040711;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #f1f5f9;
    user-select: none;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 45%, #0d162c 0%, #040711 85%);
  }
  #viewportFrame {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: 0px;
    background: #090f1d;
  }
  canvas#glCanvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
  }
  canvas#glCanvas:active { cursor: grabbing; }

  #panel {
    position: fixed;
    top: 16px;
    left: 16px;
    width: 312px;
    max-height: calc(100vh - 70px);
    overflow-y: auto;
    background: rgba(15, 23, 42, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(148, 163, 184, 0.24);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
    z-index: 20;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .header-row h1 {
    font-size: 14px;
    font-weight: 700;
    color: #f8fafc;
  }
  .badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(56, 189, 248, 0.18);
    color: #7dd3fc;
    border: 1px solid rgba(56, 189, 248, 0.35);
  }
  .search-row {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  .search-row input {
    flex: 1;
    background: rgba(15, 23, 42, 0.92);
    border: 1px solid rgba(148, 163, 184, 0.32);
    border-radius: 8px;
    padding: 6px 9px;
    color: #f8fafc;
    font-size: 12px;
    outline: none;
  }
  .search-row input:focus { border-color: #38bdf8; }
  button {
    background: rgba(30, 41, 59, 0.92);
    color: #e2e8f0;
    border: 1px solid rgba(148, 163, 184, 0.28);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: rgba(51, 65, 85, 0.95); }
  button.primary {
    background: #0284c7;
    border-color: #38bdf8;
    color: #ffffff;
  }
  button.primary:hover { background: #0369a1; }
  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 12px;
  }
  .presets button {
    font-size: 10.5px;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .section-label {
    font-size: 11px;
    font-weight: 600;
    color: #94a3b8;
    margin-bottom: 5px;
    display: flex;
    justify-content: space-between;
  }
  .section-label span.val { color: #38bdf8; }
  select {
    width: 100%;
    background: rgba(15, 23, 42, 0.92);
    color: #f1f5f9;
    border: 1px solid rgba(148, 163, 184, 0.32);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 12px;
    margin-bottom: 12px;
    outline: none;
  }
  .slider-group { margin-bottom: 11px; }
  input[type="range"] {
    width: 100%;
    accent-color: #38bdf8;
    cursor: pointer;
    height: 5px;
  }
  .tools-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 6px;
  }
  .tools-grid-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    margin-top: 6px;
  }
  #bottomBar {
    position: fixed;
    bottom: 14px;
    left: 16px;
    right: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    z-index: 20;
    gap: 10px;
  }
  .pill {
    pointer-events: auto;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 11px;
    color: #cbd5e1;
  }
  .pill.ok { border-color: rgba(52, 211, 153, 0.4); color: #6ee7b7; }
  .pill.err { border-color: rgba(248, 113, 113, 0.5); color: #fca5a5; }
</style>
</head>
<body>

<div id="stage">
  <div id="viewportFrame">
    <canvas id="glCanvas"></canvas>
  </div>
</div>

<div id="panel">
  <div class="header-row">
    <h1>Global 3D Terrain Explorer</h1>
    <span class="badge">WebGL DEM</span>
  </div>

  <div class="search-row">
    <input id="searchInput" type="text" placeholder="Place or Lat, Lon (e.g. 21.11, -11.39)" />
    <button id="searchBtn" class="primary">Go</button>
  </div>

  <div class="presets">
    <button data-lat="21.1147" data-lon="-11.3942" data-z="10.4" data-p="52" data-b="-18">Eye of Sahara</button>
    <button data-lat="27.9881" data-lon="86.9250" data-z="11.5" data-p="60" data-b="25">Mt. Everest</button>
    <button data-lat="36.1069" data-lon="-112.1129" data-z="11.5" data-p="58" data-b="-35">Grand Canyon</button>
    <button data-lat="35.3606" data-lon="138.7274" data-z="11.4" data-p="56" data-b="15">Mt. Fuji</button>
    <button data-lat="45.9766" data-lon="7.6585" data-z="12.2" data-p="62" data-b="40">Matterhorn</button>
  </div>

  <div class="section-label"><span>Surface Map Layer</span></div>
  <select id="layerSelect">
    <option value="esri_sat" selected>Esri World Satellite Imagery</option>
    <option value="esri_topo">Esri World Topographic Map</option>
    <option value="opentopo">OpenTopoMap (Contours + Relief)</option>
    <option value="esri_street">Esri World Street Map</option>
    <option value="esri_hillshade">Esri Shaded Hillshade Relief</option>
  </select>

  <div class="slider-group">
    <div class="section-label"><span>3D Camera Pitch (Tilt)</span><span class="val" id="pitchVal">52°</span></div>
    <input id="pitchSlider" type="range" min="0" max="72" step="1" value="52" />
  </div>

  <div class="slider-group">
    <div class="section-label"><span>Camera Rotation (Bearing)</span><span class="val" id="bearingVal">-18°</span></div>
    <input id="bearingSlider" type="range" min="-180" max="180" step="1" value="-18" />
  </div>

  <div class="slider-group">
    <div class="section-label"><span>Elevation Exaggeration</span><span class="val" id="exagVal">2.2x</span></div>
    <input id="exagSlider" type="range" min="0.5" max="6.0" step="0.1" value="2.2" />
  </div>

  <div class="section-label" style="margin-top:4px;"><span>Map & Camera Tools</span></div>
  <div class="tools-grid">
    <button id="zoomInBtn" class="primary">+ Zoom In</button>
    <button id="zoomOutBtn">− Zoom Out</button>
  </div>
  <div class="tools-grid-3">
    <button id="btn2D">2D Top View</button>
    <button id="btn3D">3D Oblique</button>
    <button id="btnOrbit">Auto-Orbit: Off</button>
  </div>
</div>

<div id="bottomBar">
  <div class="pill" id="coordPill">Center: 21.1147° N, 11.3942° W | Zoom: 10.4</div>
  <div class="pill">Left-Drag: Pan | Right-Drag / Shift+Drag: 3D Tilt & Rotate | Scroll: Zoom</div>
  <div class="pill ok" id="statusPill">Initializing WebGL...</div>
</div>

<script>
(function() {
  var stage = document.getElementById('stage');
  var viewportFrame = document.getElementById('viewportFrame');
  var canvas = document.getElementById('glCanvas');
  var statusPill = document.getElementById('statusPill');
  var coordPill = document.getElementById('coordPill');

  var pitchSlider = document.getElementById('pitchSlider');
  var bearingSlider = document.getElementById('bearingSlider');
  var exagSlider = document.getElementById('exagSlider');
  var layerSelect = document.getElementById('layerSelect');

  var pitchVal = document.getElementById('pitchVal');
  var bearingVal = document.getElementById('bearingVal');
  var exagVal = document.getElementById('exagVal');

  var state = {
    lat: 21.1147,
    lon: -11.3942,
    zoom: 10.4,
    pitch: 52,
    bearing: -18,
    exag: 2.2,
    layer: 'esri_sat',
    autoOrbit: false
  };

  function setStatus(msg, isError) {
    statusPill.textContent = msg;
    statusPill.className = 'pill ' + (isError ? 'err' : 'ok');
  }

  function updateViewportCornerRounding() {
    var t = Math.max(0, Math.min(1, state.pitch / 72));
    var eased = t * t * (3 - 2 * t);
    var minDim = Math.min(window.innerWidth, window.innerHeight);
    var radiusPx = Math.round(eased * (minDim * 0.46));
    var padPx = Math.round(eased * 18);

    stage.style.padding = padPx + 'px';
    viewportFrame.style.borderRadius = radiusPx + 'px';
    if (eased > 0.04) {
      var glow = (0.16 + eased * 0.28).toFixed(2);
      viewportFrame.style.boxShadow =
        '0 0 0 2px rgba(56, 189, 248, ' + glow + '), 0 28px 70px rgba(0, 0, 0, 0.92)';
    } else {
      viewportFrame.style.boxShadow = 'none';
    }
  }

  var gl = canvas.getContext('webgl', { antialias: true, alpha: false }) ||
           canvas.getContext('experimental-webgl', { antialias: true, alpha: false });

  if (!gl) {
    setStatus('WebGL unavailable in this browser', true);
    return;
  }

  var VS_SRC = [
    'attribute vec2 aGridUV;',
    'attribute float aElev;',
    'uniform mat4 uMVP;',
    'uniform vec2 uTileOrigin;',
    'uniform float uTileSize;',
    'uniform float uElevScale;',
    'varying vec2 vTexUV;',
    'varying float vElev;',
    'void main(void) {',
    '  vTexUV = clamp(aGridUV, 0.0, 1.0);',
    '  vElev = aElev;',
    '  vec2 worldXY = uTileOrigin + aGridUV * uTileSize;',
    '  float worldZ = aElev * uElevScale;',
    '  gl_Position = uMVP * vec4(worldXY, worldZ, 1.0);',
    '}'
  ].join('\n');

  var FS_SRC = [
    'precision mediump float;',
    'uniform sampler2D uSampler;',
    'uniform float uHasTexture;',
    'uniform float uPitchFactor;',
    'varying vec2 vTexUV;',
    'varying float vElev;',
    'void main(void) {',
    '  vec3 baseColor;',
    '  if (uHasTexture > 0.5) {',
    '    baseColor = texture2D(uSampler, vTexUV).rgb;',
    '  } else {',
    '    float h = clamp((vElev + 100.0) / 3500.0, 0.0, 1.0);',
    '    vec3 lowCol = vec3(0.18, 0.26, 0.22);',
    '    vec3 midCol = vec3(0.56, 0.47, 0.35);',
    '    vec3 highCol = vec3(0.88, 0.85, 0.80);',
    '    baseColor = h < 0.5 ? mix(lowCol, midCol, h * 2.0) : mix(midCol, highCol, (h - 0.5) * 2.0);',
    '  }',
    '  float reliefBoost = clamp(1.0 + (vElev - 400.0) * 0.00008, 0.88, 1.16);',
    '  vec3 shaded = baseColor * reliefBoost;',
    '  float depth = clamp(gl_FragCoord.z, 0.0, 1.0);',
    '  float haze = pow(depth, 10.0) * 0.45 * uPitchFactor;',
    '  vec3 skyColor = vec3(0.52, 0.66, 0.82);',
    '  gl_FragColor = vec4(mix(shaded, skyColor, haze), 1.0);',
    '}'
  ].join('\n');

  function compileShader(type, src) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      var info = gl.getShaderInfoLog(sh) || 'Shader compile error';
      gl.deleteShader(sh);
      throw new Error(info);
    }
    return sh;
  }

  var program;
  try {
    var vs = compileShader(gl.VERTEX_SHADER, VS_SRC);
    var fs = compileShader(gl.FRAGMENT_SHADER, FS_SRC);
    program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      var info = gl.getProgramInfoLog(program) || 'Shader link error';
      throw new Error(info);
    }
  } catch (err) {
    setStatus('Shader error: ' + err.message, true);
    return;
  }

  gl.useProgram(program);

  var loc = {
    aGridUV: gl.getAttribLocation(program, 'aGridUV'),
    aElev: gl.getAttribLocation(program, 'aElev'),
    uMVP: gl.getUniformLocation(program, 'uMVP'),
    uTileOrigin: gl.getUniformLocation(program, 'uTileOrigin'),
    uTileSize: gl.getUniformLocation(program, 'uTileSize'),
    uElevScale: gl.getUniformLocation(program, 'uElevScale'),
    uSampler: gl.getUniformLocation(program, 'uSampler'),
    uHasTexture: gl.getUniformLocation(program, 'uHasTexture'),
    uPitchFactor: gl.getUniformLocation(program, 'uPitchFactor')
  };

  var GRID_N = 40;
  var surfCols = GRID_N + 1;
  var surfVertCount = surfCols * surfCols;
  var skirtVertCount = 4 * surfCols;
  var totalVerts = surfVertCount + skirtVertCount;

  var gridUVArray = new Float32Array(totalVerts * 2);
  var ptr = 0;
  for (var r = 0; r < surfCols; r++) {
    var v = r / GRID_N;
    for (var c = 0; c < surfCols; c++) {
      var u = c / GRID_N;
      gridUVArray[ptr++] = u;
      gridUVArray[ptr++] = v;
    }
  }
  for (var c = 0; c < surfCols; c++) { gridUVArray[ptr++] = c / GRID_N; gridUVArray[ptr++] = 0.0; }
  for (var c = 0; c < surfCols; c++) { gridUVArray[ptr++] = c / GRID_N; gridUVArray[ptr++] = 1.0; }
  for (var r = 0; r < surfCols; r++) { gridUVArray[ptr++] = 0.0; gridUVArray[ptr++] = r / GRID_N; }
  for (var r = 0; r < surfCols; r++) { gridUVArray[ptr++] = 1.0; gridUVArray[ptr++] = r / GRID_N; }

  var indices = [];
  for (var r = 0; r < GRID_N; r++) {
    for (var c = 0; c < GRID_N; c++) {
      var i0 = r * surfCols + c;
      var i1 = i0 + 1;
      var i2 = i0 + surfCols;
      var i3 = i2 + 1;
      indices.push(i0, i2, i1, i1, i2, i3);
    }
  }

  var sTop = surfVertCount;
  var sBot = surfVertCount + surfCols;
  var sLeft = surfVertCount + 2 * surfCols;
  var sRight = surfVertCount + 3 * surfCols;

  for (var c = 0; c < GRID_N; c++) {
    var t0 = c, t1 = c + 1;
    var b0 = sTop + c, b1 = sTop + c + 1;
    indices.push(t0, b0, t1, t1, b0, b1);

    var rowB = GRID_N * surfCols;
    var bt0 = rowB + c, bt1 = rowB + c + 1;
    var bb0 = sBot + c, bb1 = sBot + c + 1;
    indices.push(bt0, bt1, bb0, bt1, bb1, bb0);
  }
  for (var r = 0; r < GRID_N; r++) {
    var l0 = r * surfCols, l1 = (r + 1) * surfCols;
    var lb0 = sLeft + r, lb1 = sLeft + r + 1;
    indices.push(l0, l1, lb0, l1, lb1, lb0);

    var r0 = r * surfCols + GRID_N, r1 = (r + 1) * surfCols + GRID_N;
    var rb0 = sRight + r, rb1 = sRight + r + 1;
    indices.push(r0, rb0, r1, r1, rb0, rb1);
  }

  var indexArray = new Uint16Array(indices);
  var uvBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, uvBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, gridUVArray, gl.STATIC_DRAW);

  var indexBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indexArray, gl.STATIC_DRAW);

  var zeroElevBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, zeroElevBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(totalVerts), gl.STATIC_DRAW);

  function getImageryUrl(layer, z, x, y) {
    if (layer === 'esri_topo') {
      return 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/' + z + '/' + y + '/' + x;
    }
    if (layer === 'opentopo') {
      var sub = ['a', 'b', 'c'][(x + y) % 3];
      return 'https://' + sub + '.tile.opentopomap.org/' + z + '/' + x + '/' + y + '.png';
    }
    if (layer === 'esri_street') {
      return 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/' + z + '/' + y + '/' + x;
    }
    if (layer === 'esri_hillshade') {
      return 'https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/' + z + '/' + y + '/' + x;
    }
    return 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/' + z + '/' + y + '/' + x;
  }

  function getDemUrl(z, x, y) {
    return 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/' + z + '/' + x + '/' + y + '.png';
  }

  var demCanvas = document.createElement('canvas');
  demCanvas.width = 256;
  demCanvas.height = 256;
  var demCtx = demCanvas.getContext('2d', { willReadFrequently: true });

  var texCache = new Map();
  var demCache = new Map();
  var MAX_CACHE = 220;

  var loadedImgCount = 0;
  var loadedDemCount = 0;

  function pruneCache(map, isTex) {
    if (map.size <= MAX_CACHE) return;
    var keys = Array.from(map.keys());
    for (var i = 0; i < 40; i++) {
      var k = keys[i];
      var entry = map.get(k);
      if (isTex && entry && entry.tex) gl.deleteTexture(entry.tex);
      if (!isTex && entry && entry.buf) gl.deleteBuffer(entry.buf);
      map.delete(k);
    }
  }

  function requestTexture(layer, z, x, y) {
    var key = layer + '/' + z + '/' + x + '/' + y;
    if (texCache.has(key)) return texCache.get(key);

    var entry = { status: 'loading', tex: null };
    texCache.set(key, entry);
    pruneCache(texCache, true);

    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      var tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      entry.tex = tex;
      entry.status = 'ready';
      loadedImgCount++;
      updateStatusPill();
    };
    img.onerror = function() {
      entry.status = 'error';
    };
    img.src = getImageryUrl(layer, z, x, y);
    return entry;
  }

  function requestElevation(z, x, y) {
    var key = z + '/' + x + '/' + y;
    if (demCache.has(key)) return demCache.get(key);

    var entry = { status: 'loading', buf: null };
    demCache.set(key, entry);
    pruneCache(demCache, false);

    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      try {
        demCtx.clearRect(0, 0, 256, 256);
        demCtx.drawImage(img, 0, 0, 256, 256);
        var rgba = demCtx.getImageData(0, 0, 256, 256).data;
        var elevArr = new Float32Array(totalVerts);
        var minH = 99999;

        for (var r = 0; r < surfCols; r++) {
          var py = Math.min(255, Math.round((r / GRID_N) * 255));
          for (var c = 0; c < surfCols; c++) {
            var px = Math.min(255, Math.round((c / GRID_N) * 255));
            var idx = (py * 256 + px) * 4;
            var h = (rgba[idx] * 256.0 + rgba[idx + 1] + rgba[idx + 2] / 256.0) - 32768.0;
            var clampedH = Math.max(-500, Math.min(9000, h));
            elevArr[r * surfCols + c] = clampedH;
            if (clampedH < minH) minH = clampedH;
          }
        }

        var skirtDrop = Math.max(180, 3500 / Math.pow(2, z - 6));
        var skirtBottom = minH - skirtDrop;
        for (var i = surfVertCount; i < totalVerts; i++) {
          elevArr[i] = skirtBottom;
        }

        var buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, elevArr, gl.STATIC_DRAW);
        entry.buf = buf;
        entry.status = 'ready';
        loadedDemCount++;
        updateStatusPill();
      } catch (e) {
        entry.status = 'error';
      }
    };
    img.onerror = function() {
      entry.status = 'error';
    };
    img.src = getDemUrl(z, x, y);
    return entry;
  }

  function updateStatusPill() {
    setStatus('WebGL Active | Imagery: ' + loadedImgCount + ' | DEM: ' + loadedDemCount, false);
  }

  function lonToWorldX(lon) {
    return (lon + 180.0) / 360.0;
  }
  function latToWorldY(lat) {
    var clat = Math.max(-85.0511, Math.min(85.0511, lat));
    var rad = (clat * Math.PI) / 180.0;
    return (1.0 - Math.log(Math.tan(rad) + 1.0 / Math.cos(rad)) / Math.PI) * 0.5;
  }
  function worldXToLon(wx) {
    return wx * 360.0 - 180.0;
  }
  function worldYToLat(wy) {
    var n = Math.PI - 2.0 * Math.PI * wy;
    return (180.0 / Math.PI) * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
  }

  function mat4Perspective(fovyRad, aspect, near, far) {
    var f = 1.0 / Math.tan(fovyRad / 2);
    var nf = 1 / (near - far);
    return new Float32Array([
      f / aspect, 0, 0, 0,
      0, f, 0, 0,
      0, 0, (far + near) * nf, -1,
      0, 0, 2 * far * near * nf, 0
    ]);
  }

  function mat4LookAt(eye, center, up) {
    var zx = eye[0] - center[0], zy = eye[1] - center[1], zz = eye[2] - center[2];
    var len = Math.hypot(zx, zy, zz) || 1;
    zx /= len; zy /= len; zz /= len;

    var xx = up[1] * zz - up[2] * zy;
    var xy = up[2] * zx - up[0] * zz;
    var xz = up[0] * zy - up[1] * zx;
    len = Math.hypot(xx, xy, xz) || 1;
    xx /= len; xy /= len; xz /= len;

    var yx = zy * xz - zz * xy;
    var yy = zz * xx - zx * xz;
    var yz = zx * xy - zy * xx;

    return new Float32Array([
      xx, yx, zx, 0,
      xy, yy, zy, 0,
      xz, yz, zz, 0,
      -(xx * eye[0] + xy * eye[1] + xz * eye[2]),
      -(yx * eye[0] + yy * eye[1] + yz * eye[2]),
      -(zx * eye[0] + zy * eye[1] + zz * eye[2]),
      1
    ]);
  }

  function mat4Multiply(a, b) {
    var out = new Float32Array(16);
    for (var col = 0; col < 4; col++) {
      for (var row = 0; row < 4; row++) {
        out[col * 4 + row] =
          a[0 * 4 + row] * b[col * 4 + 0] +
          a[1 * 4 + row] * b[col * 4 + 1] +
          a[2 * 4 + row] * b[col * 4 + 2] +
          a[3 * 4 + row] * b[col * 4 + 3];
      }
    }
    return out;
  }

  function resizeCanvas() {
    var rect = viewportFrame.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(1, Math.floor(rect.width * dpr));
    var h = Math.max(1, Math.floor(rect.height * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
    updateViewportCornerRounding();
  }
  window.addEventListener('resize', resizeCanvas);

  function render() {
    if (state.autoOrbit) {
      state.bearing = ((state.bearing + 0.18 + 180) % 360) - 180;
      bearingSlider.value = Math.round(state.bearing);
      bearingVal.textContent = Math.round(state.bearing) + '°';
    }

    resizeCanvas();

    var pitchRad = (state.pitch * Math.PI) / 180.0;
    var bearingRad = (state.bearing * Math.PI) / 180.0;
    var pitchFactor = state.pitch / 72.0;

    gl.clearColor(
      0.04 + pitchFactor * 0.14,
      0.07 + pitchFactor * 0.18,
      0.13 + pitchFactor * 0.24,
      1.0
    );
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);

    var cx = lonToWorldX(state.lon);
    var cy = latToWorldY(state.lat);

    var scale = Math.pow(2, state.zoom);
    var viewSpan = 1.15 / scale;
    var camDist = viewSpan * 1.35;

    var horizDist = camDist * Math.sin(pitchRad);
    var camHeight = Math.max(camDist * Math.cos(pitchRad), viewSpan * 0.04);

    var eyeX = cx + Math.sin(bearingRad) * horizDist;
    var eyeY = cy + Math.cos(bearingRad) * horizDist;
    var eyeZ = camHeight;

    var upX = -Math.sin(bearingRad);
    var upY = -Math.cos(bearingRad);

    var aspect = canvas.width / Math.max(1, canvas.height);
    var near = camDist * 0.01;
    var far = camDist * 28.0;

    var proj = mat4Perspective((42 * Math.PI) / 180, aspect, near, far);
    var view = mat4LookAt([eyeX, eyeY, eyeZ], [cx, cy, 0], [upX, upY, 0]);
    var mvp = mat4Multiply(proj, view);

    gl.uniformMatrix4fv(loc.uMVP, false, mvp);
    gl.uniform1f(loc.uPitchFactor, pitchFactor);

    var latRad = (state.lat * Math.PI) / 180.0;
    var metersPerWorldUnit = 40075016.686 * Math.cos(latRad);
    var elevScale = state.exag / Math.max(1000, metersPerWorldUnit);
    gl.uniform1f(loc.uElevScale, elevScale);

    gl.bindBuffer(gl.ARRAY_BUFFER, uvBuffer);
    gl.enableVertexAttribArray(loc.aGridUV);
    gl.vertexAttribPointer(loc.aGridUV, 2, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);

    var tileZ = Math.max(2, Math.min(16, Math.round(state.zoom)));
    var numTiles = Math.pow(2, tileZ);
    var tileSize = 1.0 / numTiles;

    var centerTX = Math.floor(cx * numTiles);
    var centerTY = Math.floor(cy * numTiles);
    var radius = state.pitch > 35 ? 4 : 3;

    gl.activeTexture(gl.TEXTURE0);
    gl.uniform1i(loc.uSampler, 0);

    for (var dy = -radius; dy <= radius; dy++) {
      var ty = centerTY + dy;
      if (ty < 0 || ty >= numTiles) continue;

      for (var dx = -radius; dx <= radius; dx++) {
        var rawTX = centerTX + dx;
        var tx = ((rawTX % numTiles) + numTiles) % numTiles;
        var originX = rawTX * tileSize;
        var originY = ty * tileSize;

        var imgEntry = requestTexture(state.layer, tileZ, tx, ty);
        var demZ = Math.min(14, tileZ);
        var shift = Math.max(0, tileZ - 14);
        var demEntry = requestElevation(demZ, tx >> shift, ty >> shift);

        gl.uniform2f(loc.uTileOrigin, originX, originY);
        gl.uniform1f(loc.uTileSize, tileSize);

        gl.bindBuffer(gl.ARRAY_BUFFER, (demEntry && demEntry.status === 'ready') ? demEntry.buf : zeroElevBuffer);
        gl.enableVertexAttribArray(loc.aElev);
        gl.vertexAttribPointer(loc.aElev, 1, gl.FLOAT, false, 0, 0);

        if (imgEntry && imgEntry.status === 'ready') {
          gl.bindTexture(gl.TEXTURE_2D, imgEntry.tex);
          gl.uniform1f(loc.uHasTexture, 1.0);
        } else {
          gl.uniform1f(loc.uHasTexture, 0.0);
        }

        gl.drawElements(gl.TRIANGLES, indexArray.length, gl.UNSIGNED_SHORT, 0);
      }
    }

    var latStr = Math.abs(state.lat).toFixed(4) + '° ' + (state.lat >= 0 ? 'N' : 'S');
    var lonStr = Math.abs(state.lon).toFixed(4) + '° ' + (state.lon >= 0 ? 'E' : 'W');
    coordPill.textContent = 'Center: ' + latStr + ', ' + lonStr + ' | Zoom: ' + state.zoom.toFixed(1);

    requestAnimationFrame(render);
  }

  var isDragging = false;
  var dragMode = 'pan';
  var lastX = 0, lastY = 0;

  canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });

  canvas.addEventListener('mousedown', function(e) {
    isDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    dragMode = (e.button === 2 || e.shiftKey) ? 'tilt' : 'pan';
  });

  window.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    var dx = e.clientX - lastX;
    var dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;

    if (dragMode === 'tilt') {
      state.bearing = ((state.bearing - dx * 0.35 + 180) % 360) - 180;
      state.pitch = Math.max(0, Math.min(72, state.pitch - dy * 0.35));
      syncSliders();
    } else {
      var scale = Math.pow(2, state.zoom);
      var speed = 0.85 / (scale * 256);
      var bRad = (state.bearing * Math.PI) / 180.0;
      var cosB = Math.cos(bRad);
      var sinB = Math.sin(bRad);

      var wx = lonToWorldX(state.lon) - (dx * cosB - dy * sinB) * speed;
      var wy = Math.max(0.01, Math.min(0.99, latToWorldY(state.lat) - (dx * sinB + dy * cosB) * speed));

      state.lon = ((worldXToLon(wx) + 540) % 360) - 180;
      state.lat = Math.max(-85, Math.min(85, worldYToLat(wy)));
    }
  });

  window.addEventListener('mouseup', function() { isDragging = false; });

  canvas.addEventListener('wheel', function(e) {
    e.preventDefault();
    var delta = e.deltaY < 0 ? 0.35 : -0.35;
    state.zoom = Math.max(2.0, Math.min(16.0, state.zoom + delta));
  }, { passive: false });

  function syncSliders() {
    pitchSlider.value = Math.round(state.pitch);
    pitchVal.textContent = Math.round(state.pitch) + '°';
    bearingSlider.value = Math.round(state.bearing);
    bearingVal.textContent = Math.round(state.bearing) + '°';
    exagSlider.value = state.exag.toFixed(1);
    exagVal.textContent = state.exag.toFixed(1) + 'x';
    updateViewportCornerRounding();
  }

  pitchSlider.addEventListener('input', function() {
    state.pitch = parseFloat(pitchSlider.value);
    pitchVal.textContent = Math.round(state.pitch) + '°';
    updateViewportCornerRounding();
  });

  bearingSlider.addEventListener('input', function() {
    state.bearing = parseFloat(bearingSlider.value);
    bearingVal.textContent = Math.round(state.bearing) + '°';
  });

  exagSlider.addEventListener('input', function() {
    state.exag = parseFloat(exagSlider.value);
    exagVal.textContent = state.exag.toFixed(1) + 'x';
  });

  layerSelect.addEventListener('change', function() {
    state.layer = layerSelect.value;
  });

  document.getElementById('zoomInBtn').addEventListener('click', function() {
    state.zoom = Math.min(16.0, state.zoom + 0.6);
  });
  document.getElementById('zoomOutBtn').addEventListener('click', function() {
    state.zoom = Math.max(2.0, state.zoom - 0.6);
  });

  window.addEventListener('keydown', function(e) {
    if (document.activeElement === document.getElementById('searchInput')) return;
    if (e.key === '+' || e.key === '=') state.zoom = Math.min(16.0, state.zoom + 0.5);
    if (e.key === '-' || e.key === '_') state.zoom = Math.max(2.0, state.zoom - 0.5);
  });

  document.getElementById('btn2D').addEventListener('click', function() {
    state.pitch = 0;
    state.bearing = 0;
    syncSliders();
  });

  document.getElementById('btn3D').addEventListener('click', function() {
    state.pitch = 56;
    syncSliders();
  });

  var btnOrbit = document.getElementById('btnOrbit');
  btnOrbit.addEventListener('click', function() {
    state.autoOrbit = !state.autoOrbit;
    btnOrbit.textContent = 'Auto-Orbit: ' + (state.autoOrbit ? 'On' : 'Off');
  });

  var presetBtns = document.querySelectorAll('.presets button');
  for (var i = 0; i < presetBtns.length; i++) {
    presetBtns[i].addEventListener('click', function() {
      state.lat = parseFloat(this.dataset.lat);
      state.lon = parseFloat(this.dataset.lon);
      state.zoom = parseFloat(this.dataset.z);
      state.pitch = parseFloat(this.dataset.p);
      state.bearing = parseFloat(this.dataset.b);
      syncSliders();
    });
  }

  function handleSearch() {
    var q = document.getElementById('searchInput').value.trim();
    if (!q) return;

    var coordMatch = q.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
    if (coordMatch) {
      state.lat = Math.max(-85, Math.min(85, parseFloat(coordMatch[1])));
      state.lon = ((parseFloat(coordMatch[2]) + 540) % 360) - 180;
      state.zoom = Math.max(state.zoom, 11.0);
      return;
    }

    setStatus('Searching location...', false);
    fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q))
      .then(function(resp) { return resp.json(); })
      .then(function(data) {
        if (data && data.length > 0) {
          state.lat = parseFloat(data[0].lat);
          state.lon = parseFloat(data[0].lon);
          state.zoom = 11.5;
          updateStatusPill();
        } else {
          setStatus('Location not found', true);
        }
      })
      .catch(function() {
        setStatus('Search unavailable offline', true);
      });
  }

  document.getElementById('searchBtn').addEventListener('click', handleSearch);
  document.getElementById('searchInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') handleSearch();
  });

  syncSliders();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
