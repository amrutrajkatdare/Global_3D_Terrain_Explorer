<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global 3D Terrain &amp; Topographic Explorer (v13)</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02040a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e2e8f0;
  }
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 45%, #0c162d 0%, #03060d 72%, #000000 100%);
    overflow: hidden;
  }
  #canvasFrame {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: 0px;
    box-shadow: 0 0 0 1px rgba(148, 163, 184, 0.14), 0 28px 80px rgba(0, 0, 0, 0.92);
    transition: width 0.08s linear, height 0.08s linear, border-radius 0.08s linear;
    background: #070d19;
  }
  canvas#glCanvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
  }
  canvas#glCanvas:active {
    cursor: grabbing;
  }
  #controlPanel {
    position: absolute;
    top: 16px;
    left: 16px;
    width: 300px;
    max-height: calc(100vh - 64px);
    overflow-y: auto;
    background: rgba(11, 18, 32, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.65);
    z-index: 20;
  }
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .panel-title {
    font-size: 14px;
    font-weight: 700;
    color: #f8fafc;
    letter-spacing: 0.2px;
  }
  .badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(56, 189, 248, 0.18);
    color: #38bdf8;
    border: 1px solid rgba(56, 189, 248, 0.35);
  }
  .search-row {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  .search-row input {
    flex: 1;
    min-width: 0;
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid rgba(148, 163, 184, 0.28);
    border-radius: 8px;
    padding: 7px 9px;
    font-size: 12px;
    color: #f1f5f9;
    outline: none;
    user-select: text;
  }
  .search-row input:focus {
    border-color: #38bdf8;
  }
  .btn-primary {
    background: #0284c7;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 7px 11px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary:hover {
    background: #0369a1;
  }
  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 12px;
  }
  .chip {
    background: rgba(30, 41, 59, 0.85);
    border: 1px solid rgba(148, 163, 184, 0.24);
    color: #cbd5e1;
    border-radius: 7px;
    padding: 4px 8px;
    font-size: 11px;
    cursor: pointer;
  }
  .chip:hover {
    background: rgba(56, 189, 248, 0.2);
    border-color: rgba(56, 189, 248, 0.45);
    color: #ffffff;
  }
  .field-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #94a3b8;
    margin-bottom: 4px;
    font-weight: 600;
  }
  .field-label span.val {
    color: #38bdf8;
    font-variant-numeric: tabular-nums;
  }
  select {
    width: 100%;
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid rgba(148, 163, 184, 0.28);
    border-radius: 8px;
    padding: 7px 9px;
    font-size: 12px;
    color: #f1f5f9;
    margin-bottom: 11px;
    outline: none;
    cursor: pointer;
  }
  .slider-group {
    margin-bottom: 10px;
  }
  input[type="range"] {
    width: 100%;
    accent-color: #38bdf8;
    cursor: pointer;
  }
  .tool-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 8px;
    margin-bottom: 6px;
  }
  .tool-grid-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    margin-top: 6px;
  }
  .btn-tool {
    background: rgba(30, 41, 59, 0.9);
    border: 1px solid rgba(148, 163, 184, 0.28);
    color: #e2e8f0;
    border-radius: 8px;
    padding: 7px 8px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
  }
  .btn-tool:hover {
    background: rgba(51, 65, 85, 0.95);
    border-color: #38bdf8;
  }
  .btn-tool.active {
    background: rgba(2, 132, 199, 0.35);
    border-color: #38bdf8;
    color: #ffffff;
  }
  #bottomBar {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    pointer-events: none;
    z-index: 20;
    font-size: 11px;
  }
  .pill {
    pointer-events: auto;
    background: rgba(11, 18, 32, 0.86);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 999px;
    padding: 5px 12px;
    color: #cbd5e1;
    white-space: nowrap;
  }
  .pill.status-ok {
    border-color: rgba(34, 197, 94, 0.45);
    color: #86efac;
  }
  .pill.status-err {
    border-color: rgba(239, 68, 68, 0.55);
    color: #fca5a5;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="canvasFrame">
    <canvas id="glCanvas"></canvas>
  </div>

  <div id="controlPanel">
    <div class="panel-header">
      <div class="panel-title">Global 3D Terrain Explorer</div>
      <div class="badge">WebGL DEM</div>
    </div>

    <div class="search-row">
      <input id="searchInput" type="text" placeholder="Place or Lat, Lon (e.g. 21.11, -11.39)" />
      <button id="searchBtn" class="btn-primary">Go</button>
    </div>

    <div class="presets">
      <button class="chip" data-lat="21.1147" data-lon="-11.3942" data-zoom="10.2" data-pitch="48">Eye of Sahara</button>
      <button class="chip" data-lat="27.9881" data-lon="86.9250" data-zoom="11.2" data-pitch="62">Mt. Everest</button>
      <button class="chip" data-lat="36.1069" data-lon="-112.1129" data-zoom="11.5" data-pitch="58">Grand Canyon</button>
      <button class="chip" data-lat="35.3606" data-lon="138.7274" data-zoom="11.4" data-pitch="56">Mt. Fuji</button>
      <button class="chip" data-lat="45.9766" data-lon="7.6585" data-zoom="12.0" data-pitch="64">Matterhorn</button>
    </div>

    <div class="field-label"><span>Surface Map Layer</span></div>
    <select id="layerSelect">
      <option value="esri_sat" selected>Esri World Satellite Imagery</option>
      <option value="esri_topo">Esri World Topographic</option>
      <option value="opentopo">OpenTopoMap (Contours)</option>
      <option value="esri_street">Esri World Street Map</option>
      <option value="esri_hillshade">Esri Shaded Hillshade</option>
    </select>

    <div class="slider-group">
      <div class="field-label"><span>3D Camera Pitch (Tilt)</span><span class="val" id="pitchVal">48°</span></div>
      <input id="pitchSlider" type="range" min="0" max="72" step="1" value="48" />
    </div>

    <div class="slider-group">
      <div class="field-label"><span>Camera Rotation (Bearing)</span><span class="val" id="bearingVal">-18°</span></div>
      <input id="bearingSlider" type="range" min="-180" max="180" step="1" value="-18" />
    </div>

    <div class="slider-group">
      <div class="field-label"><span>Elevation Exaggeration</span><span class="val" id="exagVal">2.2x</span></div>
      <input id="exagSlider" type="range" min="1.0" max="6.0" step="0.1" value="2.2" />
    </div>

    <div class="field-label" style="margin-top: 6px;"><span>Map &amp; Camera Tools</span></div>
    <div class="tool-grid">
      <button id="zoomInBtn" class="btn-tool">+ Zoom In</button>
      <button id="zoomOutBtn" class="btn-tool">&minus; Zoom Out</button>
    </div>
    <div class="tool-grid-3">
      <button id="flatBtn" class="btn-tool">2D Top View</button>
      <button id="tiltBtn" class="btn-tool">3D Oblique</button>
      <button id="orbitBtn" class="btn-tool">Auto-Orbit: Off</button>
    </div>
  </div>

  <div id="bottomBar">
    <div class="pill" id="coordPill">Center: 21.1147° N, 11.3942° W | Zoom: 10.2</div>
    <div class="pill">Left-Drag: Pan | Right-Drag / Shift+Drag: 3D Tilt &amp; Rotate | Scroll: Zoom</div>
    <div class="pill status-ok" id="statusPill">Initializing WebGL...</div>
  </div>
</div>

<script>
(function() {
  const canvasFrame = document.getElementById("canvasFrame");
  const canvas = document.getElementById("glCanvas");
  const statusPill = document.getElementById("statusPill");
  const coordPill = document.getElementById("coordPill");

  const pitchSlider = document.getElementById("pitchSlider");
  const bearingSlider = document.getElementById("bearingSlider");
  const exagSlider = document.getElementById("exagSlider");
  const pitchVal = document.getElementById("pitchVal");
  const bearingVal = document.getElementById("bearingVal");
  const exagVal = document.getElementById("exagVal");
  const layerSelect = document.getElementById("layerSelect");
  const orbitBtn = document.getElementById("orbitBtn");

  const state = {
    lat: 21.1147,
    lon: -11.3942,
    zoom: 10.2,
    pitch: 48,
    bearing: -18,
    exag: 2.2,
    layer: "esri_sat",
    autoOrbit: false
  };

  function setStatus(msg, isError) {
    statusPill.textContent = msg;
    statusPill.className = "pill " + (isError ? "status-err" : "status-ok");
  }

  function updateCanvasCornerRounding() {
    const maxPitch = 72;
    const t = Math.max(0, Math.min(1, state.pitch / maxPitch));
    const eased = Math.pow(t, 1.15);

    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const minDim = Math.min(vw, vh);

    // At 0 deg pitch: full screen square (0px radius, 100% width/height).
    // At peak 72 deg pitch: inset capsule/oval silhouette with maximum corner radius.
    const insetX = eased * Math.min(44, vw * 0.032);
    const insetY = eased * Math.min(34, vh * 0.036);
    const targetW = Math.max(320, vw - insetX * 2);
    const targetH = Math.max(240, vh - insetY * 2);
    const peakRadius = Math.min(targetW, targetH) * 0.46;
    const radiusPx = Math.round(eased * peakRadius);

    canvasFrame.style.width = targetW + "px";
    canvasFrame.style.height = targetH + "px";
    canvasFrame.style.borderRadius = radiusPx + "px";
  }

  const gl = canvas.getContext("webgl", { antialias: true, alpha: false });
  if (!gl) {
    setStatus("WebGL unavailable in this browser", true);
    return;
  }

  // Strict GLSL ES 1.00 shaders with matching precision qualifiers and zero dynamic loops
  const vsSource = [
    "attribute vec2 aGridPos;",
    "attribute float aElev;",
    "attribute float aIsSkirt;",
    "uniform mat4 uMVP;",
    "uniform vec2 uTileOrigin;",
    "uniform float uTileSize;",
    "uniform float uElevScale;",
    "uniform float uSkirtDrop;",
    "varying vec2 vUV;",
    "varying float vElev;",
    "varying float vSkirt;",
    "void main(void) {",
    "  vec2 worldXY = uTileOrigin + aGridPos * uTileSize;",
    "  float worldZ = aElev * uElevScale - aIsSkirt * uSkirtDrop;",
    "  vUV = aGridPos;",
    "  vElev = aElev;",
    "  vSkirt = aIsSkirt;",
    "  gl_Position = uMVP * vec4(worldXY.x, worldXY.y, worldZ, 1.0);",
    "}"
  ].join("\n");

  const fsSource = [
    "precision mediump float;",
    "uniform sampler2D uTex;",
    "uniform vec4 uUVRect;",
    "uniform float uHasTex;",
    "varying vec2 vUV;",
    "varying float vElev;",
    "varying float vSkirt;",
    "void main(void) {",
    "  vec2 uv = uUVRect.xy + vUV * uUVRect.zw;",
    "  vec3 baseCol;",
    "  if (uHasTex > 0.5) {",
    "    baseCol = texture2D(uTex, uv).rgb;",
    "  } else {",
    "    float h = clamp((vElev + 100.0) / 3500.0, 0.0, 1.0);",
    "    baseCol = mix(vec3(0.14, 0.22, 0.30), vec3(0.76, 0.68, 0.56), h);",
    "  }",
    "  float shade = mix(1.0, 0.72, vSkirt);",
    "  gl_FragColor = vec4(baseCol * shade, 1.0);",
    "}"
  ].join("\n");

  function compileShader(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      const info = gl.getShaderInfoLog(sh) || "Unknown shader compile error";
      gl.deleteShader(sh);
      throw new Error(info);
    }
    return sh;
  }

  let program;
  try {
    const vs = compileShader(gl.VERTEX_SHADER, vsSource);
    const fs = compileShader(gl.FRAGMENT_SHADER, fsSource);
    program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      const linkInfo = gl.getProgramInfoLog(program) || "Unknown program link error";
      throw new Error(linkInfo);
    }
  } catch (err) {
    setStatus("Shader error: " + err.message, true);
    return;
  }

  gl.useProgram(program);

  const locAGridPos = gl.getAttribLocation(program, "aGridPos");
  const locAElev = gl.getAttribLocation(program, "aElev");
  const locAIsSkirt = gl.getAttribLocation(program, "aIsSkirt");

  const locUMVP = gl.getUniformLocation(program, "uMVP");
  const locUTileOrigin = gl.getUniformLocation(program, "uTileOrigin");
  const locUTileSize = gl.getUniformLocation(program, "uTileSize");
  const locUElevScale = gl.getUniformLocation(program, "uElevScale");
  const locUSkirtDrop = gl.getUniformLocation(program, "uSkirtDrop");
  const locUTex = gl.getUniformLocation(program, "uTex");
  const locUUVRect = gl.getUniformLocation(program, "uUVRect");
  const locUHasTex = gl.getUniformLocation(program, "uHasTex");

  // Build shared grid mesh (GRID x GRID) + perimeter skirt ring to seal tile seams
  const GRID = 40;
  const vertsPerSide = GRID + 1;
  const mainVertCount = vertsPerSide * vertsPerSide;
  const skirtVertCount = 4 * vertsPerSide;
  const totalVerts = mainVertCount + skirtVertCount;

  const gridPosData = new Float32Array(totalVerts * 2);
  const skirtFlagData = new Float32Array(totalVerts);

  let ptr = 0;
  for (let y = 0; y <= GRID; y++) {
    for (let x = 0; x <= GRID; x++) {
      gridPosData[ptr * 2] = x / GRID;
      gridPosData[ptr * 2 + 1] = y / GRID;
      skirtFlagData[ptr] = 0.0;
      ptr++;
    }
  }

  // Skirt perimeter indices mapping back to main grid boundary vertices
  const skirtSourceIndex = new Int32Array(skirtVertCount);
  let sPtr = 0;
  // Top edge (y=0, x=0..GRID)
  for (let x = 0; x <= GRID; x++) skirtSourceIndex[sPtr++] = x;
  // Right edge (x=GRID, y=0..GRID)
  for (let y = 0; y <= GRID; y++) skirtSourceIndex[sPtr++] = y * vertsPerSide + GRID;
  // Bottom edge (y=GRID, x=GRID..0)
  for (let x = GRID; x >= 0; x--) skirtSourceIndex[sPtr++] = GRID * vertsPerSide + x;
  // Left edge (x=0, y=GRID..0)
  for (let y = GRID; y >= 0; y--) skirtSourceIndex[sPtr++] = y * vertsPerSide;

  for (let i = 0; i < skirtVertCount; i++) {
    const src = skirtSourceIndex[i];
    gridPosData[(mainVertCount + i) * 2] = gridPosData[src * 2];
    gridPosData[(mainVertCount + i) * 2 + 1] = gridPosData[src * 2 + 1];
    skirtFlagData[mainVertCount + i] = 1.0;
  }

  const indices = [];
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      const i0 = y * vertsPerSide + x;
      const i1 = i0 + 1;
      const i2 = i0 + vertsPerSide;
      const i3 = i2 + 1;
      indices.push(i0, i2, i1, i1, i2, i3);
    }
  }

  // Skirt triangles connecting perimeter edges downward
  for (let e = 0; e < 4; e++) {
    const offset = mainVertCount + e * vertsPerSide;
    for (let k = 0; k < GRID; k++) {
      const top0 = skirtSourceIndex[e * vertsPerSide + k];
      const top1 = skirtSourceIndex[e * vertsPerSide + k + 1];
      const bot0 = offset + k;
      const bot1 = offset + k + 1;
      indices.push(top0, bot0, top1, top1, bot0, bot1);
    }
  }

  const indexArray = new Uint16Array(indices);
  const indexCount = indexArray.length;

  const gridPosBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, gridPosBuf);
  gl.bufferData(gl.ARRAY_BUFFER, gridPosData, gl.STATIC_DRAW);

  const skirtFlagBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, skirtFlagBuf);
  gl.bufferData(gl.ARRAY_BUFFER, skirtFlagData, gl.STATIC_DRAW);

  const indexBuf = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuf);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indexArray, gl.STATIC_DRAW);

  const flatElevArray = new Float32Array(totalVerts);
  const flatElevBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, flatElevBuf);
  gl.bufferData(gl.ARRAY_BUFFER, flatElevArray, gl.STATIC_DRAW);

  // Matrix math helpers (column-major 4x4)
  function mat4Multiply(a, b) {
    const out = new Float32Array(16);
    for (let c = 0; c < 4; c++) {
      for (let r = 0; r < 4; r++) {
        out[c * 4 + r] =
          a[0 * 4 + r] * b[c * 4 + 0] +
          a[1 * 4 + r] * b[c * 4 + 1] +
          a[2 * 4 + r] * b[c * 4 + 2] +
          a[3 * 4 + r] * b[c * 4 + 3];
      }
    }
    return out;
  }

  function mat4Perspective(fovRad, aspect, near, far) {
    const f = 1.0 / Math.tan(fovRad * 0.5);
    const nf = 1.0 / (near - far);
    const out = new Float32Array(16);
    out[0] = f / aspect;
    out[5] = f;
    out[10] = (far + near) * nf;
    out[11] = -1.0;
    out[14] = 2.0 * far * near * nf;
    return out;
  }

  function mat4LookAt(eye, center, up) {
    let zx = eye[0] - center[0];
    let zy = eye[1] - center[1];
    let zz = eye[2] - center[2];
    let len = Math.hypot(zx, zy, zz) || 1;
    zx /= len; zy /= len; zz /= len;

    let xx = up[1] * zz - up[2] * zy;
    let xy = up[2] * zx - up[0] * zz;
    let xz = up[0] * zy - up[1] * zx;
    len = Math.hypot(xx, xy, xz) || 1;
    xx /= len; xy /= len; xz /= len;

    const yx = zy * xz - zz * xy;
    const yy = zz * xx - zx * xz;
    const yz = zx * xy - zy * xx;

    const out = new Float32Array(16);
    out[0] = xx; out[1] = yx; out[2] = zx; out[3] = 0;
    out[4] = xy; out[5] = yy; out[6] = zy; out[7] = 0;
    out[8] = xz; out[9] = yz; out[10] = zz; out[11] = 0;
    out[12] = -(xx * eye[0] + xy * eye[1] + xz * eye[2]);
    out[13] = -(yx * eye[0] + yy * eye[1] + yz * eye[2]);
    out[14] = -(zx * eye[0] + zy * eye[1] + zz * eye[2]);
    out[15] = 1;
    return out;
  }

  // Web Mercator projection helpers (world units: [0..1] across Earth)
  function lonToWorldX(lon) {
    return (lon + 180.0) / 360.0;
  }
  function latToWorldY(lat) {
    const clamped = Math.max(-85.05112878, Math.min(85.05112878, lat));
    const rad = clamped * Math.PI / 180.0;
    return (1.0 - Math.log(Math.tan(rad) + 1.0 / Math.cos(rad)) / Math.PI) * 0.5;
  }
  function worldXToLon(wx) {
    return wx * 360.0 - 180.0;
  }
  function worldYToLat(wy) {
    const n = Math.PI - 2.0 * Math.PI * wy;
    return (180.0 / Math.PI) * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
  }

  // Tile URL providers (zero API key required)
  function getLayerTileUrl(layer, z, x, y) {
    const n = Math.pow(2, z);
    const wx = ((x % n) + n) % n;
    if (layer === "esri_sat") {
      return "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/" + z + "/" + y + "/" + wx;
    } else if (layer === "esri_topo") {
      return "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/" + z + "/" + y + "/" + wx;
    } else if (layer === "opentopo") {
      const sub = ["a", "b", "c"][(wx + y) % 3];
      return "https://" + sub + ".tile.opentopomap.org/" + z + "/" + wx + "/" + y + ".png";
    } else if (layer === "esri_street") {
      return "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/" + z + "/" + y + "/" + wx;
    } else {
      return "https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/" + z + "/" + y + "/" + wx;
    }
  }

  function getDemTileUrl(z, x, y) {
    const n = Math.pow(2, z);
    const wx = ((x % n) + n) % n;
    return "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/" + z + "/" + wx + "/" + y + ".png";
  }

  // Caches for imagery textures and DEM vertex elevation buffers
  const texCache = new Map();
  const demCache = new Map();
  let loadedTexCount = 0;
  let loadedDemCount = 0;

  const offCanvas = document.createElement("canvas");
  offCanvas.width = 256;
  offCanvas.height = 256;
  const offCtx = offCanvas.getContext("2d", { willReadFrequently: true });

  function requestTexture(layer, z, x, y) {
    const key = layer + "/" + z + "/" + x + "/" + y;
    if (texCache.has(key)) return texCache.get(key);

    const entry = { status: "loading", texture: null };
    texCache.set(key, entry);

    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = function() {
      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      entry.texture = tex;
      entry.status = "ready";
      loadedTexCount++;
      updateStatusText();
    };
    img.onerror = function() {
      entry.status = "error";
    };
    img.src = getLayerTileUrl(layer, z, x, y);
    return entry;
  }

  function requestDem(z, x, y) {
    const demZ = Math.min(z, 14);
    const scaleDiff = z - demZ;
    const dx = Math.floor(x / Math.pow(2, scaleDiff));
    const dy = Math.floor(y / Math.pow(2, scaleDiff));
    const key = demZ + "/" + dx + "/" + dy;

    if (demCache.has(key)) return demCache.get(key);

    const entry = { status: "loading", rawHeights: null, buffersBySubTile: new Map() };
    demCache.set(key, entry);

    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = function() {
      try {
        offCtx.clearRect(0, 0, 256, 256);
        offCtx.drawImage(img, 0, 0, 256, 256);
        const rgba = offCtx.getImageData(0, 0, 256, 256).data;
        const heights = new Float32Array(256 * 256);
        for (let i = 0; i < 256 * 256; i++) {
          const r = rgba[i * 4];
          const g = rgba[i * 4 + 1];
          const b = rgba[i * 4 + 2];
          heights[i] = (r * 256.0 + g + b / 256.0) - 32768.0;
        }
        entry.rawHeights = heights;
        entry.status = "ready";
        loadedDemCount++;
        updateStatusText();
      } catch (e) {
        entry.status = "error";
      }
    };
    img.onerror = function() {
      entry.status = "error";
    };
    img.src = getDemTileUrl(demZ, dx, dy);
    return entry;
  }

  function getDemBufferForTile(z, x, y) {
    const demZ = Math.min(z, 14);
    const scaleDiff = z - demZ;
    const factor = Math.pow(2, scaleDiff);
    const dx = Math.floor(x / factor);
    const dy = Math.floor(y / factor);
    const subX = x - dx * factor;
    const subY = y - dy * factor;

    const entry = requestDem(z, x, y);
    if (entry.status !== "ready" || !entry.rawHeights) {
      return flatElevBuf;
    }

    const subKey = scaleDiff + ":" + subX + ":" + subY;
    if (entry.buffersBySubTile.has(subKey)) {
      return entry.buffersBySubTile.get(subKey);
    }

    const arr = new Float32Array(totalVerts);
    const heights = entry.rawHeights;
    let p = 0;
    for (let gy = 0; gy <= GRID; gy++) {
      const vFrac = (subY + gy / GRID) / factor;
      const py = Math.min(255, Math.max(0, vFrac * 255.0));
      const y0 = Math.floor(py);
      const y1 = Math.min(255, y0 + 1);
      const fy = py - y0;

      for (let gx = 0; gx <= GRID; gx++) {
        const uFrac = (subX + gx / GRID) / factor;
        const px = Math.min(255, Math.max(0, uFrac * 255.0));
        const x0 = Math.floor(px);
        const x1 = Math.min(255, x0 + 1);
        const fx = px - x0;

        const h00 = heights[y0 * 256 + x0];
        const h10 = heights[y0 * 256 + x1];
        const h01 = heights[y1 * 256 + x0];
        const h11 = heights[y1 * 256 + x1];

        const h0 = h00 + (h10 - h00) * fx;
        const h1 = h01 + (h11 - h01) * fx;
        arr[p++] = h0 + (h1 - h0) * fy;
      }
    }

    for (let i = 0; i < skirtVertCount; i++) {
      arr[mainVertCount + i] = arr[skirtSourceIndex[i]];
    }

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW);
    entry.buffersBySubTile.set(subKey, buf);
    return buf;
  }

  function findTextureWithParentFallback(layer, z, x, y) {
    const primary = requestTexture(layer, z, x, y);
    if (primary.status === "ready" && primary.texture) {
      return { texture: primary.texture, u0: 0, v0: 0, du: 1, dv: 1 };
    }
    let pz = z - 1;
    let px = Math.floor(x / 2);
    let py = Math.floor(y / 2);
    let scale = 0.5;
    let ox = (x % 2) * 0.5;
    let oy = (y % 2) * 0.5;

    while (pz >= 0) {
      const parent = requestTexture(layer, pz, px, py);
      if (parent.status === "ready" && parent.texture) {
        return { texture: parent.texture, u0: ox, v0: oy, du: scale, dv: scale };
      }
      ox = ox * 0.5 + (px % 2) * 0.5;
      oy = oy * 0.5 + (py % 2) * 0.5;
      scale *= 0.5;
      px = Math.floor(px / 2);
      py = Math.floor(py / 2);
      pz--;
    }
    return null;
  }

  function updateStatusText() {
    setStatus("WebGL Active | Map Tiles: " + loadedTexCount + " | DEM Tiles: " + loadedDemCount, false);
  }

  function resize() {
    updateCanvasCornerRounding();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvasFrame.getBoundingClientRect();
    const w = Math.max(1, Math.floor(rect.width * dpr));
    const h = Math.max(1, Math.floor(rect.height * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    gl.viewport(0, 0, canvas.width, canvas.height);
  }

  window.addEventListener("resize", resize);

  // Bind static vertex attribute buffers
  gl.bindBuffer(gl.ARRAY_BUFFER, gridPosBuf);
  gl.enableVertexAttribArray(locAGridPos);
  gl.vertexAttribPointer(locAGridPos, 2, gl.FLOAT, false, 0, 0);

  gl.bindBuffer(gl.ARRAY_BUFFER, skirtFlagBuf);
  gl.enableVertexAttribArray(locAIsSkirt);
  gl.vertexAttribPointer(locAIsSkirt, 1, gl.FLOAT, false, 0, 0);

  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuf);

  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);

  function render() {
    if (state.autoOrbit) {
      state.bearing += 0.14;
      if (state.bearing > 180) state.bearing -= 360;
      bearingSlider.value = Math.round(state.bearing);
      bearingVal.textContent = Math.round(state.bearing) + "°";
    }

    resize();

    // Sky/space background color shifts slightly brighter when pitched into 3D horizon
    const pitchRatio = state.pitch / 72.0;
    gl.clearColor(0.03 + pitchRatio * 0.04, 0.06 + pitchRatio * 0.08, 0.12 + pitchRatio * 0.16, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    const cx = lonToWorldX(state.lon);
    const cy = latToWorldY(state.lat);

    const aspect = canvas.width / Math.max(1, canvas.height);
    const fovRad = 45.0 * Math.PI / 180.0;

    // Camera distance scales inversely with 2^zoom
    const span = 1.35 / Math.pow(2, state.zoom);
    const camDist = span / Math.tan(fovRad * 0.5);

    const pitchRad = state.pitch * Math.PI / 180.0;
    const bearingRad = state.bearing * Math.PI / 180.0;

    // Forward-looking 3D tilt: bottom of screen tilts closer, top recedes toward horizon
    const horizDist = Math.sin(pitchRad) * camDist;
    const eyeZ = Math.cos(pitchRad) * camDist;
    const eyeX = cx + Math.sin(bearingRad) * horizDist;
    const eyeY = cy + Math.cos(bearingRad) * horizDist;

    // Forward-pointing up vector so top-down 0 deg pitch has North at top
    const upX = -Math.sin(bearingRad);
    const upY = -Math.cos(bearingRad);
    const upZ = 0.001;

    const view = mat4LookAt([eyeX, eyeY, eyeZ], [cx, cy, 0.0], [upX, upY, upZ]);
    const proj = mat4Perspective(fovRad, aspect, camDist * 0.01, camDist * 25.0);
    const mvp = mat4Multiply(proj, view);

    gl.uniformMatrix4fv(locUMVP, false, mvp);

    // Earth circumference at equator ~40,075,017 meters -> world unit conversion
    const latCos = Math.max(0.2, Math.cos(state.lat * Math.PI / 180.0));
    const metersToWorld = 1.0 / (40075017.0 * latCos);
    const elevScale = metersToWorld * state.exag;
    gl.uniform1f(locUElevScale, elevScale);

    const tileZ = Math.max(2, Math.min(16, Math.round(state.zoom)));
    const numTiles = Math.pow(2, tileZ);
    const tileSize = 1.0 / numTiles;
    gl.uniform1f(locUTileSize, tileSize);
    gl.uniform1f(locUSkirtDrop, tileSize * 0.25);

    const centerTX = Math.floor(cx * numTiles);
    const centerTY = Math.floor(cy * numTiles);

    const radius = state.pitch > 35 ? 4 : 3;

    gl.activeTexture(gl.TEXTURE0);
    gl.uniform1i(locUTex, 0);

    for (let dy = -radius; dy <= radius; dy++) {
      const ty = centerTY + dy;
      if (ty < 0 || ty >= numTiles) continue;
      for (let dx = -radius; dx <= radius; dx++) {
        const tx = centerTX + dx;
        const wrappedTX = ((tx % numTiles) + numTiles) % numTiles;

        gl.uniform2f(locUTileOrigin, tx * tileSize, ty * tileSize);

        const elevBuf = getDemBufferForTile(tileZ, wrappedTX, ty);
        gl.bindBuffer(gl.ARRAY_BUFFER, elevBuf);
        gl.enableVertexAttribArray(locAElev);
        gl.vertexAttribPointer(locAElev, 1, gl.FLOAT, false, 0, 0);

        const texInfo = findTextureWithParentFallback(state.layer, tileZ, wrappedTX, ty);
        if (texInfo) {
          gl.bindTexture(gl.TEXTURE_2D, texInfo.texture);
          gl.uniform4f(locUUVRect, texInfo.u0, texInfo.v0, texInfo.du, texInfo.dv);
          gl.uniform1f(locUHasTex, 1.0);
        } else {
          gl.uniform4f(locUUVRect, 0, 0, 1, 1);
          gl.uniform1f(locUHasTex, 0.0);
        }

        gl.drawElements(gl.TRIANGLES, indexCount, gl.UNSIGNED_SHORT, 0);
      }
    }

    const ns = state.lat >= 0 ? "N" : "S";
    const ew = state.lon >= 0 ? "E" : "W";
    coordPill.textContent =
      "Center: " + Math.abs(state.lat).toFixed(4) + "° " + ns + ", " +
      Math.abs(state.lon).toFixed(4) + "° " + ew + " | Zoom: " + state.zoom.toFixed(1);

    requestAnimationFrame(render);
  }

  // UI Event Bindings
  function syncSliders() {
    pitchSlider.value = Math.round(state.pitch);
    pitchVal.textContent = Math.round(state.pitch) + "°";
    bearingSlider.value = Math.round(state.bearing);
    bearingVal.textContent = Math.round(state.bearing) + "°";
    exagSlider.value = state.exag.toFixed(1);
    exagVal.textContent = state.exag.toFixed(1) + "x";
    updateCanvasCornerRounding();
  }

  pitchSlider.addEventListener("input", function() {
    state.pitch = parseFloat(this.value);
    pitchVal.textContent = Math.round(state.pitch) + "°";
    updateCanvasCornerRounding();
  });

  bearingSlider.addEventListener("input", function() {
    state.bearing = parseFloat(this.value);
    bearingVal.textContent = Math.round(state.bearing) + "°";
  });

  exagSlider.addEventListener("input", function() {
    state.exag = parseFloat(this.value);
    exagVal.textContent = state.exag.toFixed(1) + "x";
  });

  layerSelect.addEventListener("change", function() {
    state.layer = this.value;
  });

  document.getElementById("zoomInBtn").addEventListener("click", function() {
    state.zoom = Math.min(16.5, state.zoom + 0.65);
  });

  document.getElementById("zoomOutBtn").addEventListener("click", function() {
    state.zoom = Math.max(2.0, state.zoom - 0.65);
  });

  document.getElementById("flatBtn").addEventListener("click", function() {
    state.pitch = 0;
    state.bearing = 0;
    syncSliders();
  });

  document.getElementById("tiltBtn").addEventListener("click", function() {
    state.pitch = 56;
    syncSliders();
  });

  orbitBtn.addEventListener("click", function() {
    state.autoOrbit = !state.autoOrbit;
    this.textContent = "Auto-Orbit: " + (state.autoOrbit ? "On" : "Off");
    this.classList.toggle("active", state.autoOrbit);
  });

  document.querySelectorAll(".chip").forEach(function(btn) {
    btn.addEventListener("click", function() {
      state.lat = parseFloat(this.dataset.lat);
      state.lon = parseFloat(this.dataset.lon);
      state.zoom = parseFloat(this.dataset.zoom);
      state.pitch = parseFloat(this.dataset.pitch);
      syncSliders();
    });
  });

  // Search by coordinates or Nominatim geocoding
  async function handleSearch() {
    const q = document.getElementById("searchInput").value.trim();
    if (!q) return;

    const coordMatch = q.match(/^(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)$/);
    if (coordMatch) {
      state.lat = Math.max(-85, Math.min(85, parseFloat(coordMatch[1])));
      state.lon = Math.max(-180, Math.min(180, parseFloat(coordMatch[2])));
      state.zoom = Math.max(state.zoom, 10.5);
      return;
    }

    try {
      setStatus("Searching location...", false);
      const res = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(q));
      const data = await res.json();
      if (data && data.length > 0) {
        state.lat = parseFloat(data[0].lat);
        state.lon = parseFloat(data[0].lon);
        state.zoom = 11.0;
        updateStatusText();
      } else {
        setStatus("Location not found", true);
      }
    } catch (e) {
      setStatus("Search unavailable offline", true);
    }
  }

  document.getElementById("searchBtn").addEventListener("click", handleSearch);
  document.getElementById("searchInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") handleSearch();
  });

  // Mouse & Wheel Navigation
  let dragging = false;
  let dragMode = "pan";
  let lastX = 0;
  let lastY = 0;

  canvas.addEventListener("contextmenu", function(e) {
    e.preventDefault();
  });

  canvas.addEventListener("mousedown", function(e) {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    dragMode = (e.button === 2 || e.shiftKey) ? "tilt" : "pan";
  });

  window.addEventListener("mouseup", function() {
    dragging = false;
  });

  window.addEventListener("mousemove", function(e) {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;

    if (dragMode === "tilt") {
      state.bearing = ((state.bearing + dx * 0.35 + 540) % 360) - 180;
      state.pitch = Math.max(0, Math.min(72, state.pitch - dy * 0.32));
      syncSliders();
    } else {
      const worldScale = 1.0 / (Math.pow(2, state.zoom) * 256.0);
      const rad = state.bearing * Math.PI / 180.0;
      const cosB = Math.cos(rad);
      const sinB = Math.sin(rad);

      const moveRight = -dx * worldScale;
      const moveDown = -dy * worldScale;

      const wx = lonToWorldX(state.lon) + (moveRight * cosB - moveDown * sinB);
      const wy = latToWorldY(state.lat) + (moveRight * sinB + moveDown * cosB);

      state.lon = ((worldXToLon(wx) + 540) % 360) - 180;
      state.lat = Math.max(-85, Math.min(85, worldYToLat(Math.max(0.001, Math.min(0.999, wy)))));
    }
  });

  canvas.addEventListener("wheel", function(e) {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.45 : 0.45;
    state.zoom = Math.max(2.0, Math.min(16.5, state.zoom + delta));
  }, { passive: false });

  window.addEventListener("keydown", function(e) {
    if (document.activeElement === document.getElementById("searchInput")) return;
    if (e.key === "+" || e.key === "=") {
      state.zoom = Math.min(16.5, state.zoom + 0.5);
    } else if (e.key === "-" || e.key === "_") {
      state.zoom = Math.max(2.0, state.zoom - 0.5);
    }
  });

  syncSliders();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
