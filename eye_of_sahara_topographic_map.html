<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seamless Global 3D Terrain Map (WebGL Engine v8)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #070b14; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #e2e8f0; }
  #glCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #glCanvas:active { cursor: grabbing; }

  #uiPanel {
    position: absolute; top: 14px; left: 14px; z-index: 10;
    width: 325px; max-height: calc(100vh - 28px); overflow-y: auto;
    background: rgba(11, 17, 30, 0.90); backdrop-filter: blur(12px);
    border: 1px solid rgba(148, 163, 184, 0.22); border-radius: 12px;
    padding: 14px; box-shadow: 0 12px 32px rgba(0,0,0,0.6);
  }
  .header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .title { font-size: 14px; font-weight: 700; color: #f8fafc; letter-spacing: 0.2px; }
  .badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: rgba(56, 189, 248, 0.16); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.35); }

  .search-box { display: flex; gap: 6px; margin-bottom: 10px; }
  .search-box input {
    flex: 1; background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(148, 163, 184, 0.3);
    border-radius: 7px; padding: 7px 9px; color: #f8fafc; font-size: 12px; outline: none;
  }
  .search-box input:focus { border-color: #38bdf8; }
  .search-box button {
    background: #0284c7; color: #fff; border: none; border-radius: 7px;
    padding: 0 11px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .search-box button:hover { background: #0369a1; }

  .presets { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
  .preset-btn {
    background: rgba(30, 41, 59, 0.85); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer; transition: 0.15s;
  }
  .preset-btn:hover { background: rgba(56, 189, 248, 0.2); color: #fff; border-color: #38bdf8; }

  .group { margin-bottom: 11px; }
  .group label { display: flex; justify-content: space-between; font-size: 11.5px; color: #94a3b8; margin-bottom: 4px; }
  .group label span.val { color: #38bdf8; font-weight: 600; font-variant-numeric: tabular-nums; }
  select {
    width: 100%; background: rgba(15, 23, 42, 0.95); color: #f1f5f9;
    border: 1px solid rgba(148, 163, 184, 0.3); border-radius: 7px; padding: 6px 8px; font-size: 12px; outline: none;
  }
  input[type="range"] { width: 100%; accent-color: #38bdf8; cursor: pointer; }

  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .action-btn {
    background: rgba(30, 41, 59, 0.9); color: #e2e8f0; border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 7px; padding: 6px 8px; font-size: 11.5px; font-weight: 600; cursor: pointer;
  }
  .action-btn:hover { background: rgba(51, 65, 85, 0.95); }
  .action-btn.active { background: rgba(14, 165, 233, 0.25); border-color: #38bdf8; color: #7dd3fc; }

  .divider { height: 1px; background: rgba(148, 163, 184, 0.16); margin: 10px 0; }
  .telemetry { font-size: 11px; color: #94a3b8; line-height: 1.55; font-variant-numeric: tabular-nums; }
  .telemetry strong { color: #e2e8f0; }

  #hintBar {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 10;
    background: rgba(11, 17, 30, 0.85); backdrop-filter: blur(8px);
    border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 999px;
    padding: 6px 14px; font-size: 11.5px; color: #cbd5e1; white-space: nowrap; pointer-events: none;
  }
  #statusPill {
    position: absolute; top: 14px; right: 14px; z-index: 10;
    background: rgba(11, 17, 30, 0.88); border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 999px; padding: 5px 12px; font-size: 11px; color: #94a3b8;
  }
  #statusPill.loading { color: #38bdf8; border-color: rgba(56, 189, 248, 0.4); }
</style>
</head>
<body>

<canvas id="glCanvas"></canvas>

<div id="uiPanel">
  <div class="header-row">
    <span class="title">Global 3D Terrain Explorer</span>
    <span class="badge">WebGL Seamless</span>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search place or Lat, Lon..." />
    <button id="searchBtn">Go</button>
  </div>

  <div class="presets">
    <button class="preset-btn" data-lat="21.1147" data-lon="-11.3942" data-z="11.2" data-p="58" data-b="25">Eye of Sahara</button>
    <button class="preset-btn" data-lat="27.9881" data-lon="86.9250" data-z="11.8" data-p="65" data-b="-20">Mt. Everest</button>
    <button class="preset-btn" data-lat="36.1069" data-lon="-112.1129" data-z="12.2" data-p="62" data-b="40">Grand Canyon</button>
    <button class="preset-btn" data-lat="35.3606" data-lon="138.7274" data-z="11.8" data-p="60" data-b="15">Mt. Fuji</button>
    <button class="preset-btn" data-lat="45.9766" data-lon="7.6585" data-z="12.5" data-p="64" data-b="-35">Matterhorn</button>
  </div>

  <div class="group">
    <label>Map Surface Layer</label>
    <select id="layerSelect">
      <option value="satellite" selected>Esri World Satellite Imagery</option>
      <option value="topo">Esri World Topographic</option>
      <option value="opentopo">OpenTopoMap (Contours + Relief)</option>
      <option value="street">Esri World Street Map</option>
      <option value="hillshade">Esri Shaded Relief</option>
    </select>
  </div>

  <div class="group">
    <label>3D Camera Tilt (Pitch) <span class="val" id="pitchVal">58°</span></label>
    <input type="range" id="pitchSlider" min="0" max="75" step="1" value="58" />
  </div>

  <div class="group">
    <label>Compass Rotation (Bearing) <span class="val" id="bearingVal">25°</span></label>
    <input type="range" id="bearingSlider" min="-180" max="180" step="1" value="25" />
  </div>

  <div class="group">
    <label>Terrain Elevation Scale <span class="val" id="exagVal">2.2x</span></label>
    <input type="range" id="exagSlider" min="0" max="6" step="0.1" value="2.2" />
  </div>

  <div class="btn-row">
    <button class="action-btn" id="toggle2dBtn">Flat 2D Top-Down</button>
    <button class="action-btn" id="orbitBtn">Auto-Orbit: Off</button>
  </div>

  <div class="divider"></div>
  <div class="telemetry" id="telemetryBox">
    Center: <strong>21.1147° N, 11.3942° W</strong><br>
    Zoom: <strong>11.2</strong> &nbsp;|&nbsp; Ground Elev: <strong>405 m</strong><br>
    Mesh: <strong>Zero-Crack Continuous WebGL</strong>
  </div>
</div>

<div id="statusPill">Ready</div>
<div id="hintBar">Left-Drag: Pan &nbsp;•&nbsp; Right-Drag or Shift+Drag: 3D Tilt & Rotate &nbsp;•&nbsp; Scroll: Zoom</div>

<script>
(function() {
  const canvas = document.getElementById('glCanvas');
  const gl = canvas.getContext('webgl', { antialias: true, alpha: false });
  if (!gl) {
    alert('WebGL is not supported in this browser.');
    return;
  }

  // Enable standard derivatives for crisp procedural hillshading & anti-aliased water/horizon
  const extDeriv = gl.getExtension('OES_standard_derivatives');

  // State
  const state = {
    lat: 21.1147,
    lon: -11.3942,
    zoom: 11.2,
    pitch: 58,     // degrees (0 = top-down, 75 = steep horizon view)
    bearing: 25,   // degrees
    exag: 2.2,
    layer: 'satellite',
    autoOrbit: false,
    centerElev: 405
  };

  const LAYERS = {
    satellite: (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`,
    topo:      (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/${z}/${y}/${x}`,
    opentopo:  (z, x, y) => `https://a.tile.opentopomap.org/${z}/${x}/${y}.png`,
    street:    (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/${z}/${y}/${x}`,
    hillshade: (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/${z}/${y}/${x}`
  };
  const demUrl = (z, x, y) => `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${x}/${y}.png`;

  // WebGL Shaders: Vertex shader displaces a seamless grid + drops edge skirts to completely eliminate gaps!
  const vsSource = `
    attribute vec2 aPos;     // [0..1] across tile, slightly outside [0..1] for skirt vertices
    attribute float aSkirt;  // 0.0 for surface, 1.0 for downward skirt

    uniform mat4 uMVP;
    uniform vec2 uTileOrigin; // World mercator [0..1] top-left of tile
    uniform float uTileSize;  // World mercator width of tile
    uniform sampler2D uDemTex;
    uniform float uHasDem;
    uniform float uExag;
    uniform float uMetersToWorld;
    uniform float uSkirtDepth;

    varying vec2 vUv;
    varying float vElev;
    varying vec3 vWorldPos;
    varying float vSkirt;

    void main() {
      vec2 uv = clamp(aPos, 0.0, 1.0);
      vUv = uv;
      vSkirt = aSkirt;

      float elevMeters = 0.0;
      if (uHasDem > 0.5) {
        // Sample Terrarium RGB elevation with slight inset to avoid border clamp artifacts
        vec2 demUv = uv * (255.0 / 256.0) + (0.5 / 256.0);
        vec4 c = texture2D(uDemTex, demUv) * 255.0;
        elevMeters = (c.r * 256.0 + c.g + c.b / 256.0) - 32768.0;
        // Clamp extreme bathymetry so ocean floors stay clean
        elevMeters = max(elevMeters, -100.0);
      }

      vElev = elevMeters;
      float zWorld = elevMeters * uMetersToWorld * uExag - aSkirt * uSkirtDepth;

      vec2 merc = uTileOrigin + uv * uTileSize;
      vWorldPos = vec3(merc.x, merc.y, zWorld);
      gl_Position = uMVP * vec4(vWorldPos, 1.0);
    }
  `;

  const fsSource = `
    #extension GL_OES_standard_derivatives : enable
    precision mediump float;

    uniform sampler2D uColorTex;
    uniform float uHasColor;
    uniform vec3 uCamPos;
    uniform vec3 uSkyColor;
    uniform float uExag;
    uniform float uFade;

    varying vec2 vUv;
    varying float vElev;
    varying vec3 vWorldPos;
    varying float vSkirt;

    void main() {
      vec3 baseColor = vec3(0.14, 0.18, 0.24);
      if (uHasColor > 0.5) {
        baseColor = texture2D(uColorTex, vUv).rgb;
      }

      // Compute smooth surface normal from screen-space derivatives of 3D world position
      #ifdef GL_OES_standard_derivatives
        vec3 dx = dFdx(vWorldPos);
        vec3 dy = dFdy(vWorldPos);
        vec3 n = normalize(cross(dx, dy));
        if (n.z < 0.0) n = -n;

        // Directional sun lighting from NW to bring out ridges & canyons
        vec3 sunDir = normalize(vec3(-0.55, -0.55, 0.63));
        float diff = max(dot(n, sunDir), 0.0);
        float shade = mix(1.0, 0.62 + 0.55 * diff, clamp(uExag * 0.45, 0.0, 0.85));
        if (vSkirt < 0.5) {
          baseColor *= shade;
        }
      #endif

      // Atmospheric horizon haze (Google Earth style distance fog)
      float dist = length(vWorldPos - uCamPos);
      float fogFactor = smoothstep(0.015, 0.14, dist);
      // Adjust fog relative to camera altitude
      float alt = max(uCamPos.z, 0.0001);
      float relDist = dist / alt;
      float horizonFog = smoothstep(3.2, 11.5, relDist);

      vec3 finalColor = mix(baseColor, uSkyColor, clamp(horizonFog, 0.0, 0.92));
      gl_FragColor = vec4(finalColor, uFade);
    }
  `;

  function compileShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
    }
    return s;
  }

  const prog = gl.createProgram();
  gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, vsSource));
  gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, fsSource));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const locs = {
    aPos: gl.getAttribLocation(prog, 'aPos'),
    aSkirt: gl.getAttribLocation(prog, 'aSkirt'),
    uMVP: gl.getUniformLocation(prog, 'uMVP'),
    uTileOrigin: gl.getUniformLocation(prog, 'uTileOrigin'),
    uTileSize: gl.getUniformLocation(prog, 'uTileSize'),
    uDemTex: gl.getUniformLocation(prog, 'uDemTex'),
    uHasDem: gl.getUniformLocation(prog, 'uHasDem'),
    uColorTex: gl.getUniformLocation(prog, 'uColorTex'),
    uHasColor: gl.getUniformLocation(prog, 'uHasColor'),
    uExag: gl.getUniformLocation(prog, 'uExag'),
    uMetersToWorld: gl.getUniformLocation(prog, 'uMetersToWorld'),
    uSkirtDepth: gl.getUniformLocation(prog, 'uSkirtDepth'),
    uCamPos: gl.getUniformLocation(prog, 'uCamPos'),
    uSkyColor: gl.getUniformLocation(prog, 'uSkyColor'),
    uFade: gl.getUniformLocation(prog, 'uFade')
  };

  // Build high-density terrain grid (64x64 cells) + perimeter skirts to seal all tile seams
  const GRID = 64;
  function createTerrainMesh(N) {
    const verts = []; // x, y, skirt
    const indices = [];

    // Main surface vertices (N+1) x (N+1)
    for (let j = 0; j <= N; j++) {
      for (let i = 0; i <= N; i++) {
        verts.push(i / N, j / N, 0.0);
      }
    }
    const rowStride = N + 1;
    for (let j = 0; j < N; j++) {
      for (let i = 0; i < N; i++) {
        const a = j * rowStride + i;
        const b = a + 1;
        const c = a + rowStride;
        const d = c + 1;
        indices.push(a, c, b, b, c, d);
      }
    }

    // Add downward skirts along all 4 edges so zero cracks ever show between tiles or LODs
    function addEdgeSkirt(edgeCoords) {
      const baseStart = verts.length / 3;
      for (let k = 0; k < edgeCoords.length; k++) {
        const [u, v, topIdx] = edgeCoords[k];
        verts.push(u, v, 1.0); // skirt bottom vertex
        if (k > 0) {
          const prevTop = edgeCoords[k - 1][2];
          const currTop = topIdx;
          const prevBot = baseStart + k - 1;
          const currBot = baseStart + k;
          indices.push(prevTop, prevBot, currTop, currTop, prevBot, currBot);
        }
      }
    }

    // Top edge (j=0, i=0..N)
    const topEdge = [];
    for (let i = 0; i <= N; i++) topEdge.push([i / N, 0, i]);
    addEdgeSkirt(topEdge);

    // Bottom edge (j=N, i=N..0)
    const botEdge = [];
    for (let i = N; i >= 0; i--) botEdge.push([i / N, 1, N * rowStride + i]);
    addEdgeSkirt(botEdge);

    // Left edge (i=0, j=N..0)
    const leftEdge = [];
    for (let j = N; j >= 0; j--) leftEdge.push([0, j / N, j * rowStride]);
    addEdgeSkirt(leftEdge);

    // Right edge (i=N, j=0..N)
    const rightEdge = [];
    for (let j = 0; j <= N; j++) rightEdge.push([1, j / N, j * rowStride + N]);
    addEdgeSkirt(rightEdge);

    const vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);

    const ibo = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);

    return { vbo, ibo, count: indices.length };
  }

  const mesh = createTerrainMesh(GRID);

  // Dummy 1x1 texture fallback
  function createSolidTex(r, g, b) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([r, g, b, 255]));
    return t;
  }
  const fallbackColorTex = createSolidTex(30, 41, 59);
  const fallbackDemTex = createSolidTex(128, 0, 0); // 0m in Terrarium

  // Tile Cache & Loader
  const colorCache = new Map();
  const demCache = new Map();
  let activeDownloads = 0;
  const statusPill = document.getElementById('statusPill');

  function updateStatus() {
    if (activeDownloads > 0) {
      statusPill.textContent = `Streaming 3D Tiles (${activeDownloads})...`;
      statusPill.className = 'loading';
    } else {
      statusPill.textContent = '3D Terrain Synced';
      statusPill.className = '';
    }
  }

  function setupTexture(img, clamp) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, clamp ? gl.CLAMP_TO_EDGE : gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, clamp ? gl.CLAMP_TO_EDGE : gl.REPEAT);
    return tex;
  }

  // Offscreen canvas to read center elevation from DEM tiles
  const demReadCanvas = document.createElement('canvas');
  demReadCanvas.width = 256;
  demReadCanvas.height = 256;
  const demReadCtx = demReadCanvas.getContext('2d', { willReadFrequently: true });

  function getColorTile(layer, z, x, y) {
    const maxT = 1 << z;
    const wx = ((x % maxT) + maxT) % maxT;
    if (y < 0 || y >= maxT) return null;
    const key = `${layer}/${z}/${wx}/${y}`;
    if (colorCache.has(key)) return colorCache.get(key);

    const entry = { tex: null, loaded: false, time: 0 };
    colorCache.set(key, entry);

    const img = new Image();
    img.crossOrigin = 'anonymous';
    activeDownloads++;
    updateStatus();

    img.onload = () => {
      entry.tex = setupTexture(img, true);
      entry.loaded = true;
      entry.time = performance.now();
      activeDownloads = Math.max(0, activeDownloads - 1);
      updateStatus();
      requestRender();
    };
    img.onerror = () => {
      activeDownloads = Math.max(0, activeDownloads - 1);
      updateStatus();
    };
    img.src = LAYERS[layer](z, wx, y);
    return entry;
  }

  function getDemTile(z, x, y) {
    // Terrarium DEM max zoom is 15
    const dz = Math.min(z, 15);
    const scale = 1 << (z - dz);
    const dx = Math.floor(x / scale);
    const dy = Math.floor(y / scale);
    const maxT = 1 << dz;
    const wx = ((dx % maxT) + maxT) % maxT;
    if (dy < 0 || dy >= maxT) return null;

    const key = `${dz}/${wx}/${dy}`;
    if (demCache.has(key)) return demCache.get(key);

    const entry = { tex: null, loaded: false, pixels: null, z: dz, x: wx, y: dy };
    demCache.set(key, entry);

    const img = new Image();
    img.crossOrigin = 'anonymous';
    activeDownloads++;
    updateStatus();

    img.onload = () => {
      entry.tex = setupTexture(img, true);
      try {
        demReadCtx.drawImage(img, 0, 0);
        entry.pixels = demReadCtx.getImageData(0, 0, 256, 256).data;
      } catch (e) {}
      entry.loaded = true;
      activeDownloads = Math.max(0, activeDownloads - 1);
      updateStatus();
      requestRender();
    };
    img.onerror = () => {
      activeDownloads = Math.max(0, activeDownloads - 1);
      updateStatus();
    };
    img.src = demUrl(dz, wx, dy);
    return entry;
  }

  // Mercator helpers [0..1]
  function latLonToMerc(lat, lon) {
    const x = (lon + 180) / 360;
    const sinLat = Math.sin((lat * Math.PI) / 180);
    const y = 0.5 - Math.log((1 + sinLat) / (1 - sinLat)) / (4 * Math.PI);
    return [x, Math.max(0.001, Math.min(0.999, y))];
  }

  function mercToLatLon(x, y) {
    const lon = x * 360 - 180;
    const n = Math.PI - 2 * Math.PI * y;
    const lat = (180 / Math.PI) * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
    return [lat, lon];
  }

  function sampleElevationAt(lat, lon, z) {
    const dz = Math.min(Math.floor(z), 14);
    const [mx, my] = latLonToMerc(lat, lon);
    const n = 1 << dz;
    const tx = Math.floor(mx * n);
    const ty = Math.floor(my * n);
    const entry = getDemTile(dz, tx, ty);
    if (entry && entry.pixels) {
      const px = Math.min(255, Math.max(0, Math.floor((mx * n - tx) * 256)));
      const py = Math.min(255, Math.max(0, Math.floor((my * n - ty) * 256)));
      const idx = (py * 256 + px) * 4;
      const r = entry.pixels[idx];
      const g = entry.pixels[idx + 1];
      const b = entry.pixels[idx + 2];
      return Math.round((r * 256 + g + b / 256) - 32768);
    }
    return state.centerElev;
  }

  // Minimal 4x4 Matrix Math (Column-Major for WebGL)
  function mat4Multiply(a, b) {
    const out = new Float32Array(16);
    for (let c = 0; c < 4; c++) {
      for (let r = 0; r < 4; r++) {
        out[c * 4 + r] =
          a[0 * 4 + r] * b[c * 4 + 0] +
          a[1 * 4 + r] * b[c * 4 + 1] +
          a[2 * 4 + r] * b[c * 4 + 2] +
          a[3 * 4 + r] * b[c * 4 + 3];
      }
    }
    return out;
  }

  function mat4Perspective(fovRad, aspect, near, far) {
    const f = 1.0 / Math.tan(fovRad / 2);
    const nf = 1 / (near - far);
    return new Float32Array([
      f / aspect, 0, 0, 0,
      0, f, 0, 0,
      0, 0, (far + near) * nf, -1,
      0, 0, (2 * far * near) * nf, 0
    ]);
  }

  function mat4LookAt(eye, target, up) {
    let zx = eye[0] - target[0], zy = eye[1] - target[1], zz = eye[2] - target[2];
    let len = Math.hypot(zx, zy, zz);
    zx /= len; zy /= len; zz /= len;

    let xx = up[1] * zz - up[2] * zy;
    let xy = up[2] * zx - up[0] * zz;
    let xz = up[0] * zy - up[1] * zx;
    len = Math.hypot(xx, xy, xz);
    xx /= len; xy /= len; xz /= len;

    const yx = zy * xz - zz * xy;
    const yy = zz * xx - zx * xz;
    const yz = zx * xy - zy * xx;

    return new Float32Array([
      xx, yx, zx, 0,
      xy, yy, zy, 0,
      xz, yz, zz, 0,
      -(xx * eye[0] + xy * eye[1] + xz * eye[2]),
      -(yx * eye[0] + yy * eye[1] + yz * eye[2]),
      -(zx * eye[0] + zy * eye[1] + zz * eye[2]),
      1
    ]);
  }

  // Camera computation: standard forward-looking map camera where bottom of screen is foreground
  function getCamera() {
    const [cx, cy] = latLonToMerc(state.lat, state.lon);
    const cosLat = Math.cos((state.lat * Math.PI) / 180);
    const metersToWorld = 1.0 / (40075016.686 * Math.max(0.15, cosLat));

    // Target ground altitude
    state.centerElev = sampleElevationAt(state.lat, state.lon, state.zoom);
    const targetZ = Math.max(0, state.centerElev) * metersToWorld * state.exag;

    // Camera distance based on zoom level
    const fov = (45 * Math.PI) / 180;
    const tileSpan = Math.pow(2, -state.zoom);
    const camDist = tileSpan * 2.25;

    const pitchRad = (state.pitch * Math.PI) / 180;
    const bearRad = (state.bearing * Math.PI) / 180;

    // Note: in Mercator, +Y is South (bottom of screen), -Y is North (top of screen).
    // When bearing = 0 and pitch > 0, camera sits South (+Y) looking North (-Y) so bottom is closer!
    const horizDist = camDist * Math.sin(pitchRad);
    const vertDist = Math.max(camDist * Math.cos(pitchRad), camDist * 0.12);

    const eyeX = cx - Math.sin(bearRad) * horizDist;
    const eyeY = cy + Math.cos(bearRad) * horizDist;
    const eyeZ = targetZ + vertDist;

    // Up vector handles bearing cleanly even when pitch = 0
    const upX = Math.sin(bearRad);
    const upY = -Math.cos(bearRad);

    const aspect = canvas.width / Math.max(1, canvas.height);
    const near = Math.max(0.000002, camDist * 0.02);
    const far = camDist * 35.0;

    const proj = mat4Perspective(fov, aspect, near, far);
    const view = mat4LookAt([eyeX, eyeY, eyeZ], [cx, cy, targetZ], [upX, upY, 0]);
    const mvp = mat4Multiply(proj, view);

    return { cx, cy, targetZ, eye: [eyeX, eyeY, eyeZ], mvp, metersToWorld, camDist, bearRad };
  }

  let renderScheduled = false;
  function requestRender() {
    if (!renderScheduled) {
      renderScheduled = true;
      requestAnimationFrame(render);
    }
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.floor(window.innerWidth * dpr);
    const h = Math.floor(window.innerHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
    requestRender();
  }
  window.addEventListener('resize', resize);

  function render() {
    renderScheduled = false;

    if (state.autoOrbit) {
      state.bearing = ((state.bearing + 0.25 + 180) % 360) - 180;
      document.getElementById('bearingSlider').value = Math.round(state.bearing);
      document.getElementById('bearingVal').textContent = `${Math.round(state.bearing)}°`;
      requestRender();
    }

    const sky = [0.55, 0.72, 0.89]; // Crisp atmospheric horizon sky
    gl.clearColor(sky[0], sky[1], sky[2], 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    const cam = getCamera();

    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, mesh.vbo);
    gl.enableVertexAttribArray(locs.aPos);
    gl.vertexAttribPointer(locs.aPos, 2, gl.FLOAT, false, 12, 0);
    gl.enableVertexAttribArray(locs.aSkirt);
    gl.vertexAttribPointer(locs.aSkirt, 1, gl.FLOAT, false, 12, 8);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.ibo);

    gl.uniformMatrix4fv(locs.uMVP, false, cam.mvp);
    gl.uniform1f(locs.uExag, state.exag);
    gl.uniform1f(locs.uMetersToWorld, cam.metersToWorld);
    gl.uniform3fv(locs.uCamPos, cam.eye);
    gl.uniform3fv(locs.uSkyColor, sky);

    // Determine visible tile grid around camera focus + forward horizon
    const zInt = Math.min(16, Math.max(2, Math.round(state.zoom)));
    const nTiles = 1 << zInt;
    const tileSize = 1.0 / nTiles;
    const skirtDepth = tileSize * 0.35; // Deep enough to hide any LOD step completely
    gl.uniform1f(locs.uSkirtDepth, skirtDepth);

    // Shift tile search center slightly forward along look direction when pitched
    const forwardShift = (state.pitch / 75) * tileSize * 2.2;
    const lookX = cam.cx + Math.sin(cam.bearRad) * forwardShift;
    const lookY = cam.cy - Math.cos(cam.bearRad) * forwardShift;

    const centerTx = Math.floor(lookX * nTiles);
    const centerTy = Math.floor(lookY * nTiles);
    const radius = state.pitch > 35 ? 5 : 4;

    const tilesToDraw = [];
    for (let dy = -radius; dy <= radius; dy++) {
      for (let dx = -radius; dx <= radius; dx++) {
        const tx = centerTx + dx;
        const ty = centerTy + dy;
        if (ty < 0 || ty >= nTiles) continue;
        const distSq = dx * dx + dy * dy;
        if (distSq <= radius * radius + 2) {
          tilesToDraw.push({ tx, ty, distSq });
        }
      }
    }
    // Sort front-to-back for optimal depth buffer efficiency
    tilesToDraw.sort((a, b) => a.distSq - b.distSq);

    for (const t of tilesToDraw) {
      const originX = t.tx * tileSize;
      const originY = t.ty * tileSize;
      gl.uniform2f(locs.uTileOrigin, originX, originY);
      gl.uniform1f(locs.uTileSize, tileSize);

      // Find best available color texture (exact zoom or fallback parent zoom so there's never an empty hole)
      let colorTex = fallbackColorTex;
      let hasColor = 0.0;
      let cEntry = getColorTile(state.layer, zInt, t.tx, t.ty);
      if (cEntry && cEntry.loaded && cEntry.tex) {
        colorTex = cEntry.tex;
        hasColor = 1.0;
      } else {
        // Fallback to parent tile if still downloading
        for (let pz = zInt - 1; pz >= Math.max(2, zInt - 3); pz--) {
          const scale = 1 << (zInt - pz);
          const pEntry = getColorTile(state.layer, pz, Math.floor(t.tx / scale), Math.floor(t.ty / scale));
          if (pEntry && pEntry.loaded && pEntry.tex) {
            colorTex = pEntry.tex;
            hasColor = 1.0;
            break;
          }
        }
      }

      // Find DEM elevation texture
      let demTex = fallbackDemTex;
      let hasDem = 0.0;
      const dEntry = getDemTile(zInt, t.tx, t.ty);
      if (dEntry && dEntry.loaded && dEntry.tex) {
        demTex = dEntry.tex;
        hasDem = 1.0;
      }

      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, colorTex);
      gl.uniform1i(locs.uColorTex, 0);
      gl.uniform1f(locs.uHasColor, hasColor);

      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, demTex);
      gl.uniform1i(locs.uDemTex, 1);
      gl.uniform1f(locs.uHasDem, hasDem);
      gl.uniform1f(locs.uFade, 1.0);

      gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_SHORT, 0);
    }

    updateTelemetry();
  }

  function updateTelemetry() {
    const latStr = `${Math.abs(state.lat).toFixed(4)}° ${state.lat >= 0 ? 'N' : 'S'}`;
    const lonStr = `${Math.abs(state.lon).toFixed(4)}° ${state.lon >= 0 ? 'E' : 'W'}`;
    document.getElementById('telemetryBox').innerHTML = `
      Center: <strong>${latStr}, ${lonStr}</strong><br>
      Zoom: <strong>${state.zoom.toFixed(1)}</strong> &nbsp;|&nbsp; Ground Elev: <strong>${state.centerElev} m</strong><br>
      Mesh: <strong>Zero-Crack Continuous WebGL</strong>
    `;
  }

  // Interactive Pointer Controls (Pan, Tilt, Rotate, Zoom)
  let dragging = false;
  let dragMode = 'pan'; // 'pan' or 'orbit'
  let lastX = 0, lastY = 0;

  canvas.addEventListener('contextmenu', e => e.preventDefault());

  canvas.addEventListener('pointerdown', e => {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    dragMode = (e.button === 2 || e.shiftKey || e.ctrlKey) ? 'orbit' : 'pan';
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;

    if (dragMode === 'orbit') {
      state.bearing = ((state.bearing - dx * 0.35 + 180) % 360) - 180;
      state.pitch = Math.max(0, Math.min(75, state.pitch - dy * 0.32));
      document.getElementById('bearingSlider').value = Math.round(state.bearing);
      document.getElementById('bearingVal').textContent = `${Math.round(state.bearing)}°`;
      document.getElementById('pitchSlider').value = Math.round(state.pitch);
      document.getElementById('pitchVal').textContent = `${Math.round(state.pitch)}°`;
    } else {
      // Bearing-aligned ground pan
      const bearRad = (state.bearing * Math.PI) / 180;
      const cosB = Math.cos(bearRad);
      const sinB = Math.sin(bearRad);
      const scale = Math.pow(2, -state.zoom) * 0.0022;

      const worldDx = (-dx * cosB + dy * sinB) * scale;
      const worldDy = (-dx * sinB - dy * cosB) * scale;

      const [mx, my] = latLonToMerc(state.lat, state.lon);
      const [newLat, newLon] = mercToLatLon(mx + worldDx, Math.max(0.02, Math.min(0.98, my + worldDy)));
      state.lat = Math.max(-82, Math.min(82, newLat));
      state.lon = ((newLon + 540) % 360) - 180;
    }
    requestRender();
  });

  canvas.addEventListener('pointerup', e => {
    dragging = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  });

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const zoomDelta = -e.deltaY * 0.0015;
    state.zoom = Math.max(3.0, Math.min(16.0, state.zoom + zoomDelta));
    requestRender();
  }, { passive: false });

  // UI Event Bindings
  document.getElementById('layerSelect').addEventListener('change', e => {
    state.layer = e.target.value;
    requestRender();
  });

  document.getElementById('pitchSlider').addEventListener('input', e => {
    state.pitch = parseFloat(e.target.value);
    document.getElementById('pitchVal').textContent = `${Math.round(state.pitch)}°`;
    requestRender();
  });

  document.getElementById('bearingSlider').addEventListener('input', e => {
    state.bearing = parseFloat(e.target.value);
    document.getElementById('bearingVal').textContent = `${Math.round(state.bearing)}°`;
    requestRender();
  });

  document.getElementById('exagSlider').addEventListener('input', e => {
    state.exag = parseFloat(e.target.value);
    document.getElementById('exagVal').textContent = `${state.exag.toFixed(1)}x`;
    requestRender();
  });

  document.getElementById('toggle2dBtn').addEventListener('click', () => {
    state.pitch = state.pitch > 5 ? 0 : 58;
    document.getElementById('pitchSlider').value = state.pitch;
    document.getElementById('pitchVal').textContent = `${state.pitch}°`;
    requestRender();
  });

  const orbitBtn = document.getElementById('orbitBtn');
  orbitBtn.addEventListener('click', () => {
    state.autoOrbit = !state.autoOrbit;
    orbitBtn.textContent = `Auto-Orbit: ${state.autoOrbit ? 'On' : 'Off'}`;
    orbitBtn.classList.toggle('active', state.autoOrbit);
    if (state.autoOrbit) requestRender();
  });

  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.lat = parseFloat(btn.dataset.lat);
      state.lon = parseFloat(btn.dataset.lon);
      state.zoom = parseFloat(btn.dataset.z);
      state.pitch = parseFloat(btn.dataset.p);
      state.bearing = parseFloat(btn.dataset.b);
      document.getElementById('pitchSlider').value = state.pitch;
      document.getElementById('pitchVal').textContent = `${state.pitch}°`;
      document.getElementById('bearingSlider').value = state.bearing;
      document.getElementById('bearingVal').textContent = `${state.bearing}°`;
      requestRender();
    });
  });

  // Search via OpenStreetMap Nominatim or direct Lat, Lon input
  async function runSearch() {
    const q = document.getElementById('searchInput').value.trim();
    if (!q) return;

    const coordMatch = q.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
    if (coordMatch) {
      state.lat = Math.max(-82, Math.min(82, parseFloat(coordMatch[1])));
      state.lon = parseFloat(coordMatch[2]);
      state.zoom = 12.0;
      requestRender();
      return;
    }

    statusPill.textContent = 'Searching location...';
    statusPill.className = 'loading';
    try {
      const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`);
      const data = await resp.json();
      if (data && data.length > 0) {
        state.lat = parseFloat(data[0].lat);
        state.lon = parseFloat(data[0].lon);
        state.zoom = 12.0;
        if (state.pitch < 30) {
          state.pitch = 55;
          document.getElementById('pitchSlider').value = 55;
          document.getElementById('pitchVal').textContent = '55°';
        }
        requestRender();
      } else {
        statusPill.textContent = 'Location not found';
      }
    } catch (err) {
      statusPill.textContent = 'Search unavailable offline';
    }
  }

  document.getElementById('searchBtn').addEventListener('click', runSearch);
  document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') runSearch();
  });

  // Initialize
  resize();
})();
</script>
</body>
</html>
